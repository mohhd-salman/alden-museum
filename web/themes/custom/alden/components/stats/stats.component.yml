$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Stats
status: stable
description: Four count-up figures on an ink band, with a section heading.
props:
  type: object
  properties:
    eyebrow:
      type: string
    heading:
      type: string
    heading_level:
      type: integer
      minimum: 1
      maximum: 6
      default: 2
    stats:
      type: array
      items:
        type: object
        properties:
          value:
            type: string
            title: 'Plain numeral, e.g. 4200'
          plain:
            type: boolean
            title: 'True to render as a plain integer (no thousand separator), e.g. a year'
          label:
            type: string
        required:
          - value
          - label
  required:
    - heading
    - stats
